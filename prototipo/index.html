<!DOCTYPE html>
<html lang="es" data-faction="REBEL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlySolo — Prototipo Interactivo Galáctico</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- System Stylesheet -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- Global Header / Navbar -->
  <header class="navbar">
    <a href="#" class="brand">
      <i data-lucide="rocket" class="brand-icon"></i>
      <span>FlySolo</span>
    </a>

    <div class="nav-controls">
      <!-- Dynamic Faction Theme Selector -->
      <div class="faction-selector" title="Cambiar Tema de Facción (Acentos dinámicos)">
        <button class="selector-btn active" data-faction-btn="REBEL" onclick="setFaction('REBEL')">🔵 Rebelde</button>
        <button class="selector-btn" data-faction-btn="IMPERIAL" onclick="setFaction('IMPERIAL')">🔴 Imperial</button>
        <button class="selector-btn" data-faction-btn="NEUTRAL" onclick="setFaction('NEUTRAL')">🟡 Neutral</button>
      </div>

      <!-- Role View Switcher -->
      <div class="role-selector" title="Alternar Vista por Rol">
        <button class="selector-btn active" data-role-btn="pasajero" onclick="setRole('pasajero')">👤 Pasajero</button>
        <button class="selector-btn" data-role-btn="piloto" onclick="setRole('piloto')">🛰️ Piloto</button>
        <button class="selector-btn" data-role-btn="admin" onclick="setRole('admin')">🛡️ Admin</button>
      </div>

      <!-- Wallet Widget (Pasajero) -->
      <div id="wallet-widget-container" class="wallet-widget">
        <i data-lucide="coins"></i>
        <span id="user-credits">12,500 Cr</span>
      </div>
    </div>
  </header>

  <!-- App Main Content Root -->
  <main id="app-root" class="app-container">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Modal Overlay Container -->
  <div id="modal-container"></div>

  <!-- App Script -->
  <script src="./app.js"></script>
</body>
</html>
